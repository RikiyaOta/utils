[package]
name = "teru"
description = "A reimplementation of the Unix `ls` command, for learning Rust."
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Duplicates the workspace root's [profile.release]. Cargo only reads
# profiles from a workspace root, so building this crate as part of the
# workspace prints "profiles for the non root package will be ignored"
# and uses the root's copy -- expected, harmless. This copy is what
# actually takes effect for anyone who `cargo install teru` straight
# from crates.io, since that build has no workspace root to read from.
[profile.release]
strip = true
lto = "thin"

[dependencies]
