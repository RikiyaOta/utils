[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Rikiya Ota"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RikiyaOta/utils"
rust-version = "1.85"

# Applies to every crate: Cargo only reads [profile.*] from the workspace
# root, not from member manifests. Kept minimal since these are small,
# I/O-bound CLI tools, not something that benefits from heavier tuning.
[profile.release]
# Published binaries don't need debug symbols; this only shrinks the file.
strip = true
# "thin" LTO: most of the size/speed benefit of full LTO, far less build time.
lto = "thin"

# Lints that stand in for conventions we would otherwise repeat by hand.
# Each entry names the rule it enforces; the rationale lives in CLAUDE.md.
# Groups are deliberately not enabled here — lints are picked one at a time,
# so no `priority` juggling is needed yet.

[workspace.lints.rust]
# No `unsafe`. Absolute, so `forbid`: it cannot be lifted by an inner `allow`.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Errors reach the user as a `Result`, never as a panic. An exception must be
# written as `#[expect(clippy::unwrap_used, reason = "…")]`, which the two
# `allow_attributes*` lints below turn into a required, self-expiring comment.
unwrap_used = "warn"
expect_used = "warn"

# `main` maps errors to exit codes; nothing below it terminates the process.
exit = "warn"

# Exceptions must be `#[expect(…)]`, not `#[allow(…)]`, and must say why:
# `expect` warns once the exception stops being needed, so dead exemptions
# cannot pile up silently.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# `if cond { continue; } else { … }` inside a loop: the `else` is redundant,
# since skipping via `continue` already prevents the block from running.
needless_continue = "warn"

# `format!("{}", x)` where `x` is a bare variable: write `format!("{x}")`
# instead. Only applies when the argument is a plain identifier — an
# expression like `entry.name` or `a.len()` still needs to be passed
# positionally, since only identifiers can be captured inline.
uninlined_format_args = "warn"
